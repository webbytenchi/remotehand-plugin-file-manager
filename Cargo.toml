[package]
name = "remotehand-file-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "RemoteHand local filesystem manager"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dunce = "1"

[[bin]]
name = "remotehand-file-manager"
path = "src/main.rs"
