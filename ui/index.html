<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Manager</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:var(--remotehand-ui-font-family,Inter,ui-sans-serif,system-ui,sans-serif);font-size:var(--remotehand-ui-font-size,13px);background:var(--remotehand-background,#11151a);color:var(--remotehand-text,#dee5ef);user-select:none}
[hidden]{display:none!important}
.shell{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px}
.header{display:flex;align-items:center;gap:8px;min-width:0}
.header h1{font-size:18px;margin:0;white-space:nowrap}
.spacer{flex:1}
button,input{font:inherit}
button{border:1px solid var(--remotehand-border,#3d4a58);background:var(--remotehand-button-background,#232c37);color:var(--remotehand-text,#f3f7fb);border-radius:7px;padding:7px 10px;cursor:pointer}
button:hover{background:var(--remotehand-button-hover,#2a3542)}
button:disabled{opacity:.42;cursor:default}
button.toggle[aria-pressed="true"]{border-color:var(--remotehand-accent-border,#5d7fa4);background:var(--remotehand-accent-surface,#19304a)}
.toolbar{display:flex;align-items:center;gap:5px;min-width:0;overflow:auto}
.tool{width:34px;height:32px;padding:6px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.tool svg{width:18px;height:18px;display:block}
.tool.mirror svg{transform:scaleX(-1)}
.tool-sep{width:1px;height:22px;background:var(--remotehand-border,#384451);margin:0 2px;flex:0 0 auto}
.panes{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.panes.dual{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--remotehand-border,#2e3743);border-radius:10px;background:var(--remotehand-surface,#171d24);overflow:hidden}
.pane.active{border-color:var(--remotehand-accent-border,#5d7fa4);box-shadow:0 0 0 1px color-mix(in srgb,var(--remotehand-accent-border,#5d7fa4) 32%,transparent)}
.nav{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--remotehand-border,#2e3743)}
.nav button{min-width:34px;padding:6px 8px}
.path-wrap{min-width:0;flex:1}
.breadcrumbs{min-height:32px;width:100%;display:flex;align-items:center;gap:2px;overflow:hidden;border:1px solid var(--remotehand-border,#384451);background:var(--remotehand-input-background,#0f141a);border-radius:7px;padding:3px 5px;outline:none}
.breadcrumbs:focus{border-color:var(--remotehand-accent-border,#5d7fa4)}
.crumb{border:0;background:transparent;color:var(--remotehand-text,#eef3f8);padding:4px 6px;border-radius:5px;min-width:0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{background:var(--remotehand-button-hover,#2a3542)}
.crumb-sep{color:var(--remotehand-muted-text,#93a1b2);padding:0 1px;flex:0 0 auto}
.path-input{width:100%;border:1px solid var(--remotehand-border,#384451);background:var(--remotehand-input-background,#0f141a);color:var(--remotehand-text,#eef3f8);border-radius:7px;padding:7px 9px;outline:none;user-select:text}
.path-input:focus{border-color:var(--remotehand-accent-border,#5d7fa4)}
.status{padding:7px 10px;color:var(--remotehand-muted-text,#93a1b2);font-size:12px;border-bottom:1px solid var(--remotehand-border,#2e3743)}
.status.error{color:var(--remotehand-danger-text,#ffc6c6)}
.table-wrap{min-height:0;flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:8px 10px;border-bottom:1px solid var(--remotehand-border,#293440);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{text-align:left;color:var(--remotehand-muted-text,#93a1b2);font-size:11px;position:sticky;top:0;background:var(--remotehand-surface,#171d24);z-index:1}
th:nth-child(1){width:48%}th:nth-child(2){width:18%}th:nth-child(3){width:14%;text-align:right}th:nth-child(4){width:20%}
td:nth-child(3){text-align:right}
tr.entry{cursor:default}
tr.entry:hover{background:var(--remotehand-surface-raised,#1d2630)}
tr.entry.selected{background:var(--remotehand-accent-surface,#19304a)}
tr.entry.cut{opacity:.55}
.name-cell{display:flex;align-items:center;gap:8px;min-width:0}
.icon{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;color:var(--remotehand-muted-text,#93a1b2)}
.icon svg{width:18px;height:18px;display:block}
.icon.directory{color:var(--remotehand-accent,#579ce7)}
.icon.symlink{color:var(--remotehand-muted-text,#93a1b2)}
.icon.broken{color:var(--remotehand-danger-text,#ffc6c6)}
.name{overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 14px;text-align:center;color:var(--remotehand-muted-text,#93a1b2)}
.jobbar{display:flex;align-items:center;gap:9px;border:1px solid var(--remotehand-border,#2e3743);border-radius:9px;background:var(--remotehand-surface,#171d24);padding:7px 9px}
.jobtext{min-width:0;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.progress{height:7px;min-width:100px;flex:1;border-radius:999px;background:var(--remotehand-input-background,#0f141a);overflow:hidden;border:1px solid var(--remotehand-border,#384451)}
.progress>div{height:100%;width:0;background:var(--remotehand-accent,#579ce7)}
.jobmeta{color:var(--remotehand-muted-text,#93a1b2);font-size:12px;white-space:nowrap}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
.modal{width:min(520px,100%);max-height:min(80vh,680px);overflow:auto;background:var(--remotehand-surface,#171d24);border:1px solid var(--remotehand-border,#384451);border-radius:12px;box-shadow:0 18px 60px rgba(0,0,0,.45);padding:16px;user-select:text}
.modal h2{font-size:16px;margin:0 0 12px}
.modal p{margin:8px 0;color:var(--remotehand-muted-text,#a5b0bd)}
.modal input{width:100%;border:1px solid var(--remotehand-border,#384451);background:var(--remotehand-input-background,#0f141a);color:var(--remotehand-text,#eef3f8);border-radius:7px;padding:8px 9px;outline:none;user-select:text}
.modal input:focus{border-color:var(--remotehand-accent-border,#5d7fa4)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.props{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 12px;font-size:12px}
.props dt{color:var(--remotehand-muted-text,#93a1b2)}
.props dd{margin:0;overflow-wrap:anywhere;user-select:text}
.danger{border-color:var(--remotehand-danger-border,#7c4343)}
@media(max-width:760px){.panes.dual{grid-template-columns:minmax(0,1fr)}.panes.dual .pane[data-pane="right"]{min-height:280px}.header{flex-wrap:wrap}.toolbar{order:3;width:100%}}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>File Manager</h1>
    <div class="toolbar" role="toolbar" aria-label="File operations">
      <button id="newFolder" class="tool" type="button" title="New Folder (Ctrl+Shift+N)" aria-label="New Folder"></button>
      <span class="tool-sep"></span>
      <button id="copy" class="tool" type="button" title="Copy (Ctrl+C)" aria-label="Copy"></button>
      <button id="cut" class="tool" type="button" title="Cut (Ctrl+X)" aria-label="Cut"></button>
      <button id="paste" class="tool" type="button" title="Paste (Ctrl+V)" aria-label="Paste"></button>
      <span class="tool-sep"></span>
      <button id="rename" class="tool" type="button" title="Rename (F2)" aria-label="Rename"></button>
      <button id="delete" class="tool danger" type="button" title="Delete to Recycle Bin/Trash (Delete)" aria-label="Delete"></button>
      <button id="properties" class="tool" type="button" title="Properties (Alt+Enter)" aria-label="Properties"></button>
      <span id="otherSep" class="tool-sep" hidden></span>
      <button id="copyOther" class="tool" type="button" title="Copy to Other Pane" aria-label="Copy to Other Pane" hidden></button>
      <button id="moveOther" class="tool" type="button" title="Move to Other Pane" aria-label="Move to Other Pane" hidden></button>
    </div>
    <div class="spacer"></div>
    <button id="dualToggle" class="toggle" type="button" aria-pressed="false" title="Show or hide the second file pane">Dual Pane</button>
  </div>

  <div id="panes" class="panes"></div>

  <div id="jobbar" class="jobbar" hidden>
    <div id="jobtext" class="jobtext"></div>
    <div class="progress"><div id="jobprogress"></div></div>
    <div id="jobmeta" class="jobmeta"></div>
    <button id="jobCancel" class="tool" type="button" title="Cancel file operation" aria-label="Cancel file operation"></button>
  </div>
</div>

<template id="paneTemplate">
  <section class="pane">
    <div class="nav">
      <button class="back" type="button" title="Back (Alt+Left)">←</button>
      <button class="forward" type="button" title="Forward (Alt+Right)">→</button>
      <button class="parent" type="button" title="Parent (Alt+Up)">↑</button>
      <button class="refresh" type="button" title="Refresh (F5)">⟳</button>
      <div class="path-wrap">
        <div class="breadcrumbs" tabindex="0" aria-label="Current path"></div>
        <input class="path-input" autocomplete="off" spellcheck="false" aria-label="Edit current path" hidden>
      </div>
    </div>
    <div class="status">Loading…</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Modified</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" hidden>This folder is empty.</div>
    </div>
  </section>
</template>

<div id="modalBackdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</div>

<script>
(() => {
  const request = (method, params = null) => window.remotehand.request(method, params);
  const panesHost = document.getElementById("panes");
  const paneTemplate = document.getElementById("paneTemplate");
  const dualToggle = document.getElementById("dualToggle");

  const controls = {
    newFolder: document.getElementById("newFolder"),
    copy: document.getElementById("copy"),
    cut: document.getElementById("cut"),
    paste: document.getElementById("paste"),
    rename: document.getElementById("rename"),
    delete: document.getElementById("delete"),
    properties: document.getElementById("properties"),
    copyOther: document.getElementById("copyOther"),
    moveOther: document.getElementById("moveOther"),
    otherSep: document.getElementById("otherSep")
  };

  const jobbar = document.getElementById("jobbar");
  const jobtext = document.getElementById("jobtext");
  const jobprogress = document.getElementById("jobprogress");
  const jobmeta = document.getElementById("jobmeta");
  const jobCancel = document.getElementById("jobCancel");

  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalTitle = document.getElementById("modalTitle");
  const modalBody = document.getElementById("modalBody");
  const modalActions = document.getElementById("modalActions");

  let dualPane = false;
  let activePaneId = "left";
  let saveTimer = null;
  let clipboard = null;
  let activeJobId = null;
  let activeJobCutPaths = null;
  let modalDismiss = null;
  const panes = {};

  const svg = {
    folderPlus:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2h6.5A2.5 2.5 0 0 1 21 8.5v8A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-10Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M15 10v5m-2.5-2.5h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    copy:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>',
    cut:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="18" r="2.4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m8 7.5 11 8.5M8 16.5 19 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    paste:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5h6v3H9V5Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 7H6v13h12V7h-2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 12h6m-6 4h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    rename:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 18h4l9-9-4-4-9 9v4Z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="m12.5 6.5 4 4M4 20h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    trash:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3m-8 0 1 13h8l1-13M10 10v7m4-7v7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
    info:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 10v6m0-9.5h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>',
    copyOther:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="7" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11.5h7m0 0-2.5-2.5m2.5 2.5-2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.5 16v4m-2-2h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    moveOther:'<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="6" width="7" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 11.5h7.5m0 0-3-3m3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    close:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>'
  };

  controls.newFolder.innerHTML = svg.folderPlus;
  controls.copy.innerHTML = svg.copy;
  controls.cut.innerHTML = svg.cut;
  controls.paste.innerHTML = svg.paste;
  controls.rename.innerHTML = svg.rename;
  controls.delete.innerHTML = svg.trash;
  controls.properties.innerHTML = svg.info;
  controls.copyOther.innerHTML = svg.copyOther;
  controls.moveOther.innerHTML = svg.moveOther;
  jobCancel.innerHTML = svg.close;

  const formatSize = size => {
    if (size === null || size === undefined) return "";
    if (size < 1024) return `${size} B`;
    const units = ["KB", "MB", "GB", "TB"];
    let value = size / 1024;
    let unit = units[0];
    for (let index = 1; index < units.length && value >= 1024; index += 1) {
      value /= 1024;
      unit = units[index];
    }
    return `${value >= 10 ? value.toFixed(1) : value.toFixed(2)} ${unit}`;
  };

  const formatModified = value => {
    if (!value) return "";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
  };

  const basename = path => {
    const cleaned = String(path || "").replace(/[\\/]+$/, "");
    const parts = cleaned.split(/[\\/]/);
    return parts[parts.length - 1] || cleaned;
  };

  const kindLabel = entry => {
    if (entry.kind === "symlink") {
      if (entry.brokenLink) return "Broken link";
      if (entry.linkTargetKind === "directory") return "Folder link";
      if (entry.linkTargetKind === "file") return "File link";
      return "Link";
    }
    return ({ directory: "Folder", file: "File", other: "Other" }[entry.kind] || entry.kind);
  };

  const iconSvg = entry => {
    if (entry.kind === "directory") {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5.5A2.5 2.5 0 0 1 5.5 3H10l2 2h6.5A2.5 2.5 0 0 1 21 7.5v9A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-11Zm2.5-.5a.5.5 0 0 0-.5.5V7h14a2.5 2.5 0 0 1 2 .99V7.5a.5.5 0 0 0-.5-.5h-7.33l-2-2H5.5ZM5 9v7.5a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.5-.5H5Z"/></svg>';
    }
    if (entry.kind === "symlink") {
      const targetFolder = entry.linkTargetKind === "directory";
      const shape = targetFolder
        ? '<path fill="currentColor" d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/>'
        : '<path fill="currentColor" d="M6 3h8l4 4v14H6V3Zm8 1.8V8h3.2L14 4.8Z"/>';
      const overlay = entry.brokenLink
        ? '<path d="M14.5 14.5 20 20M20 14.5 14.5 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
        : '<path d="M13.5 10.5h6m0 0-2.5-2.5m2.5 2.5L17 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>';
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + shape + overlay + '</svg>';
    }
    if (entry.kind === "file") {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3h8l4 4v14H6V3Zm8 1.8V8h3.2L14 4.8Z"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>';
  };

  function splitPath(path) {
    const normalized = String(path || "");
    if (!normalized) return [];
    if (/^[A-Za-z]:\\/.test(normalized)) {
      const drive = normalized.slice(0, 3);
      const rest = normalized.slice(3).split("\\").filter(Boolean);
      const parts = [{ label: drive, path: drive }];
      let current = drive.replace(/\\$/, "");
      for (const segment of rest) {
        current += "\\" + segment;
        parts.push({ label: segment, path: current });
      }
      return parts;
    }
    if (normalized.startsWith("\\\\")) {
      const segments = normalized.slice(2).split("\\").filter(Boolean);
      const parts = [];
      let current = "\\\\";
      for (const segment of segments) {
        current += (current === "\\\\" ? "" : "\\") + segment;
        parts.push({ label: segment, path: current });
      }
      return parts;
    }
    if (normalized.startsWith("/")) {
      const segments = normalized.split("/").filter(Boolean);
      const parts = [{ label: "/", path: "/" }];
      let current = "";
      for (const segment of segments) {
        current += "/" + segment;
        parts.push({ label: segment, path: current });
      }
      return parts;
    }
    return [{ label: normalized, path: normalized }];
  }

  function selectedEntries(pane = activePane()) {
    if (!pane) return [];
    return pane.entries.filter(entry => pane.selectedPaths.has(entry.path));
  }

  function selectedEntry(pane = activePane()) {
    const selected = selectedEntries(pane);
    return selected.length === 1 ? selected[0] : null;
  }

  function refreshToolbar() {
    const pane = activePane();
    const selected = selectedEntries(pane);
    const selectedCount = selected.length;
    const operationRunning = activeJobId !== null;
    controls.newFolder.disabled = !pane || !pane.currentPath || operationRunning;
    controls.copy.disabled = selectedCount === 0 || operationRunning;
    controls.cut.disabled = selectedCount === 0 || operationRunning;
    controls.paste.disabled = !clipboard || !pane || !pane.currentPath || operationRunning;
    controls.rename.disabled = selectedCount !== 1 || operationRunning;
    controls.delete.disabled = selectedCount === 0 || operationRunning;
    controls.properties.disabled = selectedCount !== 1;
    const otherVisible = dualPane;
    controls.otherSep.hidden = !otherVisible;
    controls.copyOther.hidden = !otherVisible;
    controls.moveOther.hidden = !otherVisible;
    controls.copyOther.disabled = selectedCount === 0 || operationRunning;
    controls.moveOther.disabled = selectedCount === 0 || operationRunning;
    const mirrorOtherPaneIcons = activePaneId === "right";
    controls.copyOther.classList.toggle("mirror", mirrorOtherPaneIcons);
    controls.moveOther.classList.toggle("mirror", mirrorOtherPaneIcons);
  }

  class BrowserPane {
    constructor(id) {
      this.id = id;
      this.currentPath = "";
      this.parentPath = null;
      this.entries = [];
      this.back = [];
      this.forward = [];
      this.selectedPaths = new Set();
      this.selectionAnchorIndex = null;
      this.busy = false;

      const fragment = paneTemplate.content.cloneNode(true);
      this.element = fragment.querySelector(".pane");
      this.element.dataset.pane = id;
      panesHost.append(fragment);
      this.element = panesHost.querySelector('.pane[data-pane="' + id + '"]');
      this.backButton = this.element.querySelector(".back");
      this.forwardButton = this.element.querySelector(".forward");
      this.parentButton = this.element.querySelector(".parent");
      this.refreshButton = this.element.querySelector(".refresh");
      this.pathWrap = this.element.querySelector(".path-wrap");
      this.breadcrumbs = this.element.querySelector(".breadcrumbs");
      this.pathInput = this.element.querySelector(".path-input");
      this.status = this.element.querySelector(".status");
      this.body = this.element.querySelector("tbody");
      this.empty = this.element.querySelector(".empty");

      this.element.addEventListener("pointerdown", () => setActivePane(this.id));
      this.element.addEventListener("focusin", () => setActivePane(this.id));
      this.backButton.addEventListener("click", () => this.goBack());
      this.forwardButton.addEventListener("click", () => this.goForward());
      this.parentButton.addEventListener("click", () => this.parentPath && this.navigate(this.parentPath));
      this.refreshButton.addEventListener("click", () => this.currentPath && this.load(this.currentPath, "refresh"));
      this.breadcrumbs.addEventListener("click", event => {
        if (event.target === this.breadcrumbs) this.beginPathEdit(false);
      });
      this.breadcrumbs.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          this.beginPathEdit(true);
        }
      });
      this.pathWrap.addEventListener("dblclick", event => {
        if (!this.pathInput.hidden && event.target !== this.pathInput) return;
        if (event.target === this.breadcrumbs || event.target === this.pathWrap) this.beginPathEdit(true);
      });
      this.pathInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          const target = this.pathInput.value.trim();
          if (target) {
            this.endPathEdit();
            this.navigate(target);
          }
        } else if (event.key === "Escape") {
          event.preventDefault();
          this.endPathEdit();
          this.breadcrumbs.focus();
        }
      });
      this.pathInput.addEventListener("blur", () => this.endPathEdit());
      this.updateButtons();
    }

    setHidden(hidden) { this.element.hidden = hidden; }
    setBusy(value) {
      this.busy = value;
      this.pathInput.disabled = value;
      this.updateButtons();
      refreshToolbar();
    }
    updateButtons() {
      this.backButton.disabled = this.busy || this.back.length === 0;
      this.forwardButton.disabled = this.busy || this.forward.length === 0;
      this.parentButton.disabled = this.busy || !this.parentPath;
      this.refreshButton.disabled = this.busy || !this.currentPath;
    }
    beginPathEdit(selectAll = false) {
      if (this.busy) return;
      setActivePane(this.id);
      this.breadcrumbs.hidden = true;
      this.pathInput.hidden = false;
      this.pathInput.value = this.currentPath;
      this.pathInput.focus();
      if (selectAll) this.pathInput.select();
    }
    endPathEdit() {
      this.pathInput.hidden = true;
      this.breadcrumbs.hidden = false;
      this.pathInput.value = this.currentPath;
    }
    renderBreadcrumbs() {
      this.breadcrumbs.replaceChildren();
      const parts = splitPath(this.currentPath);
      parts.forEach((part, index) => {
        if (index > 0) {
          const sep = document.createElement("span");
          sep.className = "crumb-sep";
          sep.textContent = "›";
          this.breadcrumbs.append(sep);
        }
        const button = document.createElement("button");
        button.type = "button";
        button.className = "crumb";
        button.textContent = part.label;
        button.title = part.path;
        button.addEventListener("click", event => {
          event.stopPropagation();
          setActivePane(this.id);
          this.navigate(part.path);
        });
        this.breadcrumbs.append(button);
      });
    }
    render() {
      this.body.replaceChildren();
      this.empty.hidden = this.entries.length !== 0;
      for (const entry of this.entries) {
        const row = document.createElement("tr");
        row.className = "entry";
        if (this.selectedPaths.has(entry.path)) row.classList.add("selected");
        if (clipboard && clipboard.mode === "move" && clipboard.paths.includes(entry.path)) row.classList.add("cut");
        row.tabIndex = 0;

        const nameCell = document.createElement("td");
        const nameWrap = document.createElement("div");
        nameWrap.className = "name-cell";
        const icon = document.createElement("span");
        icon.className = "icon " + entry.kind + (entry.brokenLink ? " broken" : "");
        icon.innerHTML = iconSvg(entry);
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = entry.name;
        nameWrap.append(icon, name);
        nameCell.append(nameWrap);

        const typeCell = document.createElement("td");
        typeCell.textContent = kindLabel(entry);
        const sizeCell = document.createElement("td");
        sizeCell.textContent = formatSize(entry.size);
        const modifiedCell = document.createElement("td");
        modifiedCell.textContent = formatModified(entry.modifiedMs);
        row.append(nameCell, typeCell, sizeCell, modifiedCell);

        const entryIndex = this.entries.indexOf(entry);
        row.addEventListener("click", event => {
          setActivePane(this.id);

          if (event.shiftKey && this.selectionAnchorIndex !== null) {
            const start = Math.min(this.selectionAnchorIndex, entryIndex);
            const end = Math.max(this.selectionAnchorIndex, entryIndex);
            const range = this.entries.slice(start, end + 1).map(item => item.path);
            if (!(event.ctrlKey || event.metaKey)) this.selectedPaths.clear();
            for (const path of range) this.selectedPaths.add(path);
          } else if (event.ctrlKey || event.metaKey) {
            if (this.selectedPaths.has(entry.path)) this.selectedPaths.delete(entry.path);
            else this.selectedPaths.add(entry.path);
            this.selectionAnchorIndex = entryIndex;
          } else {
            this.selectedPaths.clear();
            this.selectedPaths.add(entry.path);
            this.selectionAnchorIndex = entryIndex;
          }

          this.render();
          refreshToolbar();
        });

        const canNavigate = entry.kind === "directory"
          || (entry.kind === "symlink" && entry.linkTargetKind === "directory" && !entry.brokenLink);
        row.addEventListener("dblclick", () => { if (canNavigate) this.navigate(entry.path); });
        row.addEventListener("keydown", event => {
          if (event.key === "Enter" && canNavigate) {
            event.preventDefault();
            this.navigate(entry.path);
          }
        });
        this.body.append(row);
      }

      this.status.classList.remove("error");
      const selectedCount = this.selectedPaths.size;
      this.status.textContent = selectedCount > 0
        ? `${selectedCount} selected · ${this.entries.length} item${this.entries.length === 1 ? "" : "s"}`
        : `${this.entries.length} item${this.entries.length === 1 ? "" : "s"}`;
      this.updateButtons();
      refreshToolbar();
    }

    async load(path = null, historyMode = "push", fallbackToInitial = false) {
      if (this.busy) return false;
      const previousPath = this.currentPath;
      this.setBusy(true);
      this.status.classList.remove("error");
      this.status.textContent = "Loading…";
      try {
        const result = path === null ? await request("fs.initial") : await request("fs.list", { path });
        if (historyMode === "push" && previousPath && previousPath !== result.path) {
          this.back.push(previousPath);
          this.forward = [];
        }
        this.currentPath = result.path;
        this.parentPath = result.parent || null;
        this.entries = Array.isArray(result.entries) ? result.entries : [];
        this.selectedPaths.clear();
        this.selectionAnchorIndex = null;
        this.pathInput.value = this.currentPath;
        this.renderBreadcrumbs();
        this.render();
        scheduleSave();
        return true;
      } catch (error) {
        if (fallbackToInitial && path !== null) {
          this.setBusy(false);
          return this.load(null, "initial", false);
        }
        this.status.classList.add("error");
        this.status.textContent = String(error);
        this.pathInput.value = this.currentPath || path || "";
        if (!this.pathInput.hidden) this.pathInput.focus();
        return false;
      } finally {
        this.setBusy(false);
        this.updateButtons();
      }
    }

    navigate(path) {
      if (!path || path === this.currentPath) return;
      this.load(path, "push");
    }
    async goBack() {
      if (this.busy || this.back.length === 0) return;
      const target = this.back.pop();
      if (this.currentPath) this.forward.push(this.currentPath);
      const ok = await this.load(target, "history");
      if (!ok) {
        this.forward.pop();
        this.back.push(target);
      }
      this.updateButtons();
    }
    async goForward() {
      if (this.busy || this.forward.length === 0) return;
      const target = this.forward.pop();
      if (this.currentPath) this.back.push(this.currentPath);
      const ok = await this.load(target, "history");
      if (!ok) {
        this.back.pop();
        this.forward.push(target);
      }
      this.updateButtons();
    }
  }

  function setActivePane(id) {
    if (id === "right" && !dualPane) id = "left";
    activePaneId = id;
    for (const pane of Object.values(panes)) {
      pane.element.classList.toggle("active", pane.id === activePaneId);
    }
    refreshToolbar();
    scheduleSave();
  }
  function activePane() { return panes[activePaneId] || panes.left; }
  function otherPane() { return activePaneId === "left" ? panes.right : panes.left; }

  function applyLayout() {
    panesHost.classList.toggle("dual", dualPane);
    panes.right.setHidden(!dualPane);
    dualToggle.setAttribute("aria-pressed", String(dualPane));
    dualToggle.textContent = dualPane ? "Single Pane" : "Dual Pane";
    if (!dualPane && activePaneId === "right") setActivePane("left");
    refreshToolbar();
  }

  function uiState() {
    return {
      dualPane,
      leftPath: panes.left.currentPath || null,
      rightPath: panes.right.currentPath || null,
      activePane: activePaneId
    };
  }

  function scheduleSave() {
    if (saveTimer !== null) clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      saveTimer = null;
      try { await request("ui.state.set", uiState()); }
      catch (error) { console.warn("File Manager could not persist UI state:", error); }
    }, 150);
  }

  function closeModal() {
    modalBackdrop.hidden = true;
    modalTitle.textContent = "";
    modalBody.replaceChildren();
    modalActions.replaceChildren();
    modalDismiss = null;
  }

  function dismissModal() {
    const dismiss = modalDismiss;
    modalDismiss = null;
    if (dismiss) dismiss();
    else closeModal();
  }

  function actionButton(label, primary = false) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = label;
    if (primary) button.style.borderColor = "var(--remotehand-accent-border,#5d7fa4)";
    return button;
  }

  function promptModal(title, label, initialValue = "") {
    return new Promise(resolve => {
      modalTitle.textContent = title;
      modalBody.replaceChildren();
      const text = document.createElement("p");
      text.textContent = label;
      const input = document.createElement("input");
      input.value = initialValue;
      modalBody.append(text, input);
      modalActions.replaceChildren();
      const cancel = actionButton("Cancel");
      const ok = actionButton("OK", true);
      const finish = value => { closeModal(); resolve(value); };
      modalDismiss = () => finish(null);
      cancel.addEventListener("click", () => finish(null));
      ok.addEventListener("click", () => finish(input.value.trim()));
      input.addEventListener("keydown", event => {
        if (event.key === "Enter") { event.preventDefault(); finish(input.value.trim()); }
        if (event.key === "Escape") { event.preventDefault(); finish(null); }
      });
      modalActions.append(cancel, ok);
      modalBackdrop.hidden = false;
      input.focus();
      input.select();
    });
  }

  function confirmModal(title, message, confirmLabel = "OK") {
    return new Promise(resolve => {
      modalTitle.textContent = title;
      modalBody.replaceChildren();
      const p = document.createElement("p");
      p.textContent = message;
      modalBody.append(p);
      modalActions.replaceChildren();
      const cancel = actionButton("Cancel");
      const ok = actionButton(confirmLabel, true);
      const finish = value => { closeModal(); resolve(value); };
      modalDismiss = () => finish(false);
      cancel.addEventListener("click", () => finish(false));
      ok.addEventListener("click", () => finish(true));
      modalActions.append(cancel, ok);
      modalBackdrop.hidden = false;
      ok.focus();
    });
  }

  function showPropertiesModal(properties) {
    modalTitle.textContent = "Properties";
    modalBody.replaceChildren();
    const dl = document.createElement("dl");
    dl.className = "props";
    const rows = [
      ["Name", properties.name],
      ["Type", properties.kind],
      ["Location", properties.path],
      ["Size", properties.size == null ? "—" : formatSize(properties.size)],
      ["Modified", properties.modifiedMs ? formatModified(properties.modifiedMs) : "—"],
      ["Hidden", properties.hidden ? "Yes" : "No"]
    ];
    if (properties.linkTarget) rows.push(["Link target", properties.linkTarget]);
    if (properties.linkTargetKind) rows.push(["Target type", properties.linkTargetKind]);
    for (const [label, value] of rows) {
      const dt = document.createElement("dt");
      const dd = document.createElement("dd");
      dt.textContent = label;
      dd.textContent = String(value ?? "—");
      dl.append(dt, dd);
    }
    modalBody.append(dl);
    modalActions.replaceChildren();
    const close = actionButton("Close", true);
    modalDismiss = closeModal;
    close.addEventListener("click", closeModal);
    modalActions.append(close);
    modalBackdrop.hidden = false;
    close.focus();
  }

  async function refreshAllPanes() {
    const tasks = [];
    if (panes.left.currentPath) tasks.push(panes.left.load(panes.left.currentPath, "refresh"));
    if (panes.right.currentPath) tasks.push(panes.right.load(panes.right.currentPath, "refresh"));
    await Promise.allSettled(tasks);
  }

  function setClipboard(mode) {
    const entries = selectedEntries();
    if (entries.length === 0 || activeJobId !== null) return;
    clipboard = {
      mode,
      paths: entries.map(entry => entry.path),
      names: entries.map(entry => entry.name)
    };
    for (const pane of Object.values(panes)) pane.render();
    refreshToolbar();
  }

  async function runJob(kind, sources, destinationDir, clearCutOnSuccess = false) {
    if (activeJobId !== null || !Array.isArray(sources) || sources.length === 0) return;
    try {
      const started = await request("fs.job.start", { kind, sources, destinationDir });
      activeJobId = started.jobId;
      activeJobCutPaths = clearCutOnSuccess ? [...sources] : null;
      jobbar.hidden = false;
      refreshToolbar();
      await pollJob(activeJobId);
    } catch (error) {
      await confirmModal("File operation failed", String(error), "Close");
    }
  }

  async function pollJob(id) {
    try {
      for (;;) {
        const job = await request("fs.job.get", { id });
        const total = Number(job.bytesTotal || 0);
        const done = Number(job.bytesDone || 0);
        const itemsTotal = Number(job.itemsTotal || 0);
        const itemsDone = Number(job.itemsDone || 0);
        const percent = total > 0 ? Math.min(100, (done / total) * 100) : (itemsTotal > 0 ? Math.min(100, (itemsDone / itemsTotal) * 100) : 0);
        jobprogress.style.width = `${percent}%`;
        const sourceCount = Array.isArray(job.sources) ? job.sources.length : 0;
        const sourceLabel = sourceCount === 1 ? basename(job.sources[0]) : `${sourceCount} selected items`;
        jobtext.textContent = `${job.kind === "move" ? "Moving" : "Copying"} ${sourceLabel}`;
        jobmeta.textContent = job.state === "scanning"
          ? "Scanning…"
          : `${job.state} · ${itemsDone}/${itemsTotal || "?"} items`;
        jobCancel.disabled = !job.cancellable || !["queued","scanning","running"].includes(job.state);

        if (["completed","failed","cancelled"].includes(job.state)) {
          if (
            job.state === "completed"
            && activeJobCutPaths
            && clipboard
            && clipboard.mode === "move"
            && clipboard.paths.length === activeJobCutPaths.length
            && clipboard.paths.every(path => activeJobCutPaths.includes(path))
          ) {
            clipboard = null;
          }
          activeJobId = null;
          activeJobCutPaths = null;
          refreshToolbar();
          await refreshAllPanes();
          for (const pane of Object.values(panes)) pane.render();

          if (job.state === "failed") {
            jobbar.hidden = true;
            await confirmModal("File operation failed", job.error || "The file operation failed.", "Close");
          } else if (job.state === "cancelled") {
            jobtext.textContent = "Operation cancelled";
            jobmeta.textContent = "";
            setTimeout(() => { if (activeJobId === null) jobbar.hidden = true; }, 1000);
          } else {
            jobtext.textContent = "Operation completed";
            jobmeta.textContent = "";
            jobprogress.style.width = "100%";
            setTimeout(() => { if (activeJobId === null) jobbar.hidden = true; }, 1000);
          }
          return;
        }

        await new Promise(resolve => setTimeout(resolve, 180));
      }
    } catch (error) {
      activeJobId = null;
      activeJobCutPaths = null;
      jobbar.hidden = true;
      refreshToolbar();
      await confirmModal("File operation failed", String(error), "Close");
    }
  }

  async function pasteClipboard() {
    const pane = activePane();
    if (!clipboard || !pane.currentPath || activeJobId !== null) return;
    await runJob(clipboard.mode === "move" ? "move" : "copy", clipboard.paths, pane.currentPath, clipboard.mode === "move");
  }

  async function createFolder() {
    const pane = activePane();
    if (!pane.currentPath || activeJobId !== null) return;
    const name = await promptModal("New Folder", "Folder name:");
    if (!name) return;
    try {
      await request("fs.mkdir", { parent: pane.currentPath, name });
      await pane.load(pane.currentPath, "refresh");
    } catch (error) {
      await confirmModal("Could not create folder", String(error), "Close");
    }
  }

  async function renameSelected() {
    const pane = activePane();
    const entry = selectedEntry(pane);
    if (!entry || activeJobId !== null) return;
    const name = await promptModal("Rename", "New name:", entry.name);
    if (!name || name === entry.name) return;
    try {
      await request("fs.rename", { path: entry.path, name });
      await refreshAllPanes();
    } catch (error) {
      await confirmModal("Could not rename item", String(error), "Close");
    }
  }

  async function deleteSelected() {
    const entries = selectedEntries();
    if (entries.length === 0 || activeJobId !== null) return;
    const message = entries.length === 1
      ? `Move “${entries[0].name}” to the Recycle Bin/Trash?`
      : `Move ${entries.length} selected items to the Recycle Bin/Trash?`;
    const ok = await confirmModal("Move to Recycle Bin/Trash", message, "Delete");
    if (!ok) return;
    try {
      const paths = entries.map(entry => entry.path);
      await request("fs.deleteMany", { paths });
      if (clipboard && clipboard.paths.some(path => paths.includes(path))) clipboard = null;
      await refreshAllPanes();
    } catch (error) {
      await confirmModal("Could not delete item", String(error), "Close");
    }
  }

  async function showProperties() {
    const entry = selectedEntry();
    if (!entry) return;
    try {
      const properties = await request("fs.properties", { path: entry.path });
      showPropertiesModal(properties);
    } catch (error) {
      await confirmModal("Could not read properties", String(error), "Close");
    }
  }

  async function sendToOther(kind) {
    if (!dualPane || activeJobId !== null) return;
    const entries = selectedEntries();
    const destination = otherPane();
    if (entries.length === 0 || !destination.currentPath) return;
    await runJob(kind, entries.map(entry => entry.path), destination.currentPath, false);
  }

  controls.newFolder.addEventListener("click", createFolder);
  controls.copy.addEventListener("click", () => setClipboard("copy"));
  controls.cut.addEventListener("click", () => setClipboard("move"));
  controls.paste.addEventListener("click", pasteClipboard);
  controls.rename.addEventListener("click", renameSelected);
  controls.delete.addEventListener("click", deleteSelected);
  controls.properties.addEventListener("click", showProperties);
  controls.copyOther.addEventListener("click", () => sendToOther("copy"));
  controls.moveOther.addEventListener("click", () => sendToOther("move"));
  jobCancel.addEventListener("click", async () => {
    if (activeJobId === null) return;
    try { await request("fs.job.cancel", { id: activeJobId }); }
    catch (error) { console.warn("Could not cancel File Manager job:", error); }
  });

  dualToggle.addEventListener("click", async () => {
    dualPane = !dualPane;
    if (dualPane && !panes.right.currentPath) {
      await panes.right.load(panes.left.currentPath || null, "initial", true);
    }
    applyLayout();
    scheduleSave();
  });

  window.addEventListener("mousedown", event => {
    if (event.button === 3) {
      event.preventDefault();
      activePane().goBack();
      return;
    }
    if (event.button === 4) {
      event.preventDefault();
      activePane().goForward();
    }
  }, { capture: true });

  window.addEventListener("auxclick", event => {
    if (event.button === 3 || event.button === 4) event.preventDefault();
  }, { capture: true });

  window.addEventListener("keydown", event => {
    if (!modalBackdrop.hidden) {
      if (event.key === "Escape") {
        event.preventDefault();
        dismissModal();
      }
      return;
    }
    const pane = activePane();
    const key = event.key.toLowerCase();
    const typing = event.target instanceof HTMLInputElement || event.target.isContentEditable;
    if (typing) return;

    if (event.ctrlKey && key === "a") {
      event.preventDefault();
      pane.selectedPaths = new Set(pane.entries.map(entry => entry.path));
      pane.selectionAnchorIndex = pane.entries.length > 0 ? 0 : null;
      pane.render();
      refreshToolbar();
      return;
    }

    if (event.ctrlKey && event.shiftKey && key === "n") {
      event.preventDefault();
      createFolder();
      return;
    }
    if (event.ctrlKey && key === "c") {
      event.preventDefault();
      setClipboard("copy");
      return;
    }
    if (event.ctrlKey && key === "x") {
      event.preventDefault();
      setClipboard("move");
      return;
    }
    if (event.ctrlKey && key === "v") {
      event.preventDefault();
      pasteClipboard();
      return;
    }
    if (event.ctrlKey && key === "l") {
      event.preventDefault();
      pane.beginPathEdit(true);
      return;
    }
    if (event.altKey && event.key === "ArrowLeft") {
      event.preventDefault();
      pane.goBack();
      return;
    }
    if (event.altKey && event.key === "ArrowRight") {
      event.preventDefault();
      pane.goForward();
      return;
    }
    if (event.altKey && event.key === "ArrowUp") {
      event.preventDefault();
      if (pane.parentPath) pane.navigate(pane.parentPath);
      return;
    }
    if (event.altKey && event.key === "Enter") {
      event.preventDefault();
      showProperties();
      return;
    }
    if (event.key === "F2") {
      event.preventDefault();
      renameSelected();
      return;
    }
    if (event.key === "Delete") {
      event.preventDefault();
      deleteSelected();
      return;
    }
    if (event.key === "F5") {
      event.preventDefault();
      if (pane.currentPath) pane.load(pane.currentPath, "refresh");
    }
  });

  async function initialize() {
    panes.left = new BrowserPane("left");
    panes.right = new BrowserPane("right");
    let stored = null;
    try { stored = await request("ui.state.get"); }
    catch (error) { console.warn("File Manager could not restore UI state:", error); }

    dualPane = Boolean(stored && stored.dualPane);
    activePaneId = stored && stored.activePane === "right" ? "right" : "left";
    applyLayout();
    setActivePane(activePaneId);

    const leftPath = stored && stored.leftPath ? stored.leftPath : null;
    await panes.left.load(leftPath, "initial", true);
    const rightPath = stored && stored.rightPath ? stored.rightPath : panes.left.currentPath;
    await panes.right.load(rightPath || null, "initial", true);

    applyLayout();
    setActivePane(activePaneId);
    refreshToolbar();
    scheduleSave();
  }

  initialize();
})();
</script>
</body>
</html>
