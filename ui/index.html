<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Manager</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{font-family:var(--remotehand-ui-font-family,Inter,ui-sans-serif,system-ui,sans-serif);font-size:var(--remotehand-ui-font-size,13px);background:var(--remotehand-background,#11151a);color:var(--remotehand-text,#dee5ef);user-select:none}
[hidden]{display:none!important}
.shell{height:100%;display:flex;flex-direction:column;padding:12px;gap:10px}
.header{display:flex;align-items:center;gap:10px}
.header h1{font-size:18px;margin:0}
.spacer{flex:1}
button,input{font:inherit}
button{border:1px solid var(--remotehand-border,#3d4a58);background:var(--remotehand-button-background,#232c37);color:var(--remotehand-text,#f3f7fb);border-radius:7px;padding:7px 10px;cursor:pointer}
button:hover{background:var(--remotehand-button-hover,#2a3542)}
button:disabled{opacity:.45;cursor:default}
button.toggle[aria-pressed="true"]{border-color:var(--remotehand-accent-border,#5d7fa4);background:var(--remotehand-accent-surface,#19304a)}
.panes{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.panes.dual{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--remotehand-border,#2e3743);border-radius:10px;background:var(--remotehand-surface,#171d24);overflow:hidden}
.pane.active{border-color:var(--remotehand-accent-border,#5d7fa4);box-shadow:0 0 0 1px color-mix(in srgb,var(--remotehand-accent-border,#5d7fa4) 32%,transparent)}
.nav{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--remotehand-border,#2e3743)}
.nav button{min-width:34px;padding:6px 8px}
.path-wrap{min-width:0;flex:1}
.breadcrumbs{min-height:32px;width:100%;display:flex;align-items:center;gap:2px;overflow:hidden;border:1px solid var(--remotehand-border,#384451);background:var(--remotehand-input-background,#0f141a);border-radius:7px;padding:3px 5px;outline:none}
.breadcrumbs:focus{border-color:var(--remotehand-accent-border,#5d7fa4)}
.crumb{border:0;background:transparent;color:var(--remotehand-text,#eef3f8);padding:4px 6px;border-radius:5px;min-width:0;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{background:var(--remotehand-button-hover,#2a3542)}
.crumb-sep{color:var(--remotehand-muted-text,#93a1b2);padding:0 1px;flex:0 0 auto}
.path-input{width:100%;border:1px solid var(--remotehand-border,#384451);background:var(--remotehand-input-background,#0f141a);color:var(--remotehand-text,#eef3f8);border-radius:7px;padding:7px 9px;outline:none;user-select:text}
.path-input:focus{border-color:var(--remotehand-accent-border,#5d7fa4)}
.status{padding:7px 10px;color:var(--remotehand-muted-text,#93a1b2);font-size:12px;border-bottom:1px solid var(--remotehand-border,#2e3743)}
.status.error{color:var(--remotehand-danger-text,#ffc6c6)}
.table-wrap{min-height:0;flex:1;overflow:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:8px 10px;border-bottom:1px solid var(--remotehand-border,#293440);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
th{text-align:left;color:var(--remotehand-muted-text,#93a1b2);font-size:11px;position:sticky;top:0;background:var(--remotehand-surface,#171d24);z-index:1}
th:nth-child(1){width:48%}th:nth-child(2){width:18%}th:nth-child(3){width:14%;text-align:right}th:nth-child(4){width:20%}
td:nth-child(3){text-align:right}
tr.entry{cursor:default}
tr.entry:hover{background:var(--remotehand-surface-raised,#1d2630)}
tr.entry.selected{background:var(--remotehand-accent-surface,#19304a)}
.name-cell{display:flex;align-items:center;gap:8px;min-width:0}
.icon{width:18px;height:18px;flex:0 0 18px;display:inline-flex;align-items:center;justify-content:center;color:var(--remotehand-muted-text,#93a1b2)}
.icon svg{width:18px;height:18px;display:block}
.icon.directory{color:var(--remotehand-accent,#579ce7)}
.icon.symlink{color:var(--remotehand-muted-text,#93a1b2)}
.icon.broken{color:var(--remotehand-danger-text,#ffc6c6)}
.name{overflow:hidden;text-overflow:ellipsis}
.empty{padding:28px 14px;text-align:center;color:var(--remotehand-muted-text,#93a1b2)}
@media(max-width:760px){.panes.dual{grid-template-columns:minmax(0,1fr)}.panes.dual .pane[data-pane="right"]{min-height:280px}}
</style>
</head>
<body>
<div class="shell">
  <div class="header">
    <h1>File Manager</h1>
    <div class="spacer"></div>
    <button id="dualToggle" class="toggle" type="button" aria-pressed="false" title="Show or hide the second file pane">Dual Pane</button>
  </div>
  <div id="panes" class="panes"></div>
</div>

<template id="paneTemplate">
  <section class="pane">
    <div class="nav">
      <button class="back" type="button" title="Back (Alt+Left)">←</button>
      <button class="forward" type="button" title="Forward (Alt+Right)">→</button>
      <button class="parent" type="button" title="Parent (Alt+Up)">↑</button>
      <button class="refresh" type="button" title="Refresh (F5)">⟳</button>
      <div class="path-wrap">
        <div class="breadcrumbs" tabindex="0" aria-label="Current path"></div>
        <input class="path-input" autocomplete="off" spellcheck="false" aria-label="Edit current path" hidden>
      </div>
    </div>
    <div class="status">Loading…</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Type</th><th>Size</th><th>Modified</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" hidden>This folder is empty.</div>
    </div>
  </section>
</template>

<script>
(() => {
  const request = (method, params = null) => window.remotehand.request(method, params);
  const panesHost = document.getElementById("panes");
  const paneTemplate = document.getElementById("paneTemplate");
  const dualToggle = document.getElementById("dualToggle");

  let dualPane = false;
  let activePaneId = "left";
  let saveTimer = null;
  const panes = {};

  const formatSize = size => {
    if (size === null || size === undefined) return "";
    if (size < 1024) return `${size} B`;
    const units = ["KB", "MB", "GB", "TB"];
    let value = size / 1024;
    let unit = units[0];
    for (let index = 1; index < units.length && value >= 1024; index += 1) {
      value /= 1024;
      unit = units[index];
    }
    return `${value >= 10 ? value.toFixed(1) : value.toFixed(2)} ${unit}`;
  };

  const formatModified = value => {
    if (!value) return "";
    const date = new Date(value);
    return Number.isNaN(date.getTime()) ? "" : date.toLocaleString();
  };

  const kindLabel = entry => {
    if (entry.kind === "symlink") {
      if (entry.brokenLink) return "Broken link";
      if (entry.linkTargetKind === "directory") return "Folder link";
      if (entry.linkTargetKind === "file") return "File link";
      return "Link";
    }
    return ({ directory: "Folder", file: "File", other: "Other" }[entry.kind] || entry.kind);
  };

  const iconSvg = entry => {
    if (entry.kind === "directory") {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 5.5A2.5 2.5 0 0 1 5.5 3H10l2 2h6.5A2.5 2.5 0 0 1 21 7.5v9A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-11Zm2.5-.5a.5.5 0 0 0-.5.5V7h14a2.5 2.5 0 0 1 2 .99V7.5a.5.5 0 0 0-.5-.5h-7.33l-2-2H5.5ZM5 9v7.5a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.5-.5H5Z"/></svg>';
    }
    if (entry.kind === "symlink") {
      const targetFolder = entry.linkTargetKind === "directory";
      const shape = targetFolder
        ? '<path fill="currentColor" d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/>'
        : '<path fill="currentColor" d="M6 3h8l4 4v14H6V3Zm8 1.8V8h3.2L14 4.8Z"/>';
      const overlay = entry.brokenLink
        ? '<path d="M14.5 14.5 20 20M20 14.5 14.5 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>'
        : '<path d="M13.5 10.5h6m0 0-2.5-2.5m2.5 2.5L17 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>';
      return '<svg viewBox="0 0 24 24" aria-hidden="true">' + shape + overlay + '</svg>';
    }
    if (entry.kind === "file") {
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6 3h8l4 4v14H6V3Zm8 1.8V8h3.2L14 4.8Z"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>';
  };

  function splitPath(path) {
    const normalized = String(path || "");
    if (!normalized) return [];

    if (/^[A-Za-z]:\\/.test(normalized)) {
      const drive = normalized.slice(0, 3);
      const rest = normalized.slice(3).split("\\").filter(Boolean);
      const parts = [{ label: drive, path: drive }];
      let current = drive.replace(/\\$/, "");
      for (const segment of rest) {
        current += "\\" + segment;
        parts.push({ label: segment, path: current });
      }
      return parts;
    }

    if (normalized.startsWith("\\\\")) {
      const segments = normalized.slice(2).split("\\").filter(Boolean);
      const parts = [];
      let current = "\\\\";
      for (const segment of segments) {
        current += (current === "\\\\" ? "" : "\\") + segment;
        parts.push({ label: segment, path: current });
      }
      return parts;
    }

    if (normalized.startsWith("/")) {
      const segments = normalized.split("/").filter(Boolean);
      const parts = [{ label: "/", path: "/" }];
      let current = "";
      for (const segment of segments) {
        current += "/" + segment;
        parts.push({ label: segment, path: current });
      }
      return parts;
    }

    return [{ label: normalized, path: normalized }];
  }

  class BrowserPane {
    constructor(id) {
      this.id = id;
      this.currentPath = "";
      this.parentPath = null;
      this.entries = [];
      this.back = [];
      this.forward = [];
      this.selectedPath = null;
      this.busy = false;

      const fragment = paneTemplate.content.cloneNode(true);
      this.element = fragment.querySelector(".pane");
      this.element.dataset.pane = id;
      panesHost.append(fragment);
      this.element = panesHost.querySelector('.pane[data-pane="' + id + '"]');

      this.backButton = this.element.querySelector(".back");
      this.forwardButton = this.element.querySelector(".forward");
      this.parentButton = this.element.querySelector(".parent");
      this.refreshButton = this.element.querySelector(".refresh");
      this.pathWrap = this.element.querySelector(".path-wrap");
      this.breadcrumbs = this.element.querySelector(".breadcrumbs");
      this.pathInput = this.element.querySelector(".path-input");
      this.status = this.element.querySelector(".status");
      this.body = this.element.querySelector("tbody");
      this.empty = this.element.querySelector(".empty");

      this.element.addEventListener("pointerdown", () => setActivePane(this.id));
      this.element.addEventListener("focusin", () => setActivePane(this.id));

      this.backButton.addEventListener("click", () => this.goBack());
      this.forwardButton.addEventListener("click", () => this.goForward());
      this.parentButton.addEventListener("click", () => this.parentPath && this.navigate(this.parentPath));
      this.refreshButton.addEventListener("click", () => this.currentPath && this.load(this.currentPath, "refresh"));

      this.breadcrumbs.addEventListener("click", event => {
        if (event.target === this.breadcrumbs) this.beginPathEdit(false);
      });
      this.breadcrumbs.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === "F2") {
          event.preventDefault();
          this.beginPathEdit(true);
        }
      });
      this.pathWrap.addEventListener("dblclick", event => {
        if (!this.pathInput.hidden) return;
        if (event.target === this.breadcrumbs || event.target === this.pathWrap) this.beginPathEdit(true);
      });
      this.pathInput.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          const target = this.pathInput.value.trim();
          if (target) {
            this.endPathEdit();
            this.navigate(target);
          }
        } else if (event.key === "Escape") {
          event.preventDefault();
          this.endPathEdit();
          this.breadcrumbs.focus();
        }
      });
      this.pathInput.addEventListener("blur", () => this.endPathEdit());
      this.updateButtons();
    }

    setHidden(hidden) {
      this.element.hidden = hidden;
    }

    setBusy(value) {
      this.busy = value;
      this.pathInput.disabled = value;
      this.updateButtons();
    }

    updateButtons() {
      this.backButton.disabled = this.busy || this.back.length === 0;
      this.forwardButton.disabled = this.busy || this.forward.length === 0;
      this.parentButton.disabled = this.busy || !this.parentPath;
      this.refreshButton.disabled = this.busy || !this.currentPath;
    }

    beginPathEdit(selectAll = false) {
      if (this.busy) return;
      setActivePane(this.id);
      this.breadcrumbs.hidden = true;
      this.pathInput.hidden = false;
      this.pathInput.value = this.currentPath;
      this.pathInput.focus();
      if (selectAll) this.pathInput.select();
    }

    endPathEdit() {
      this.pathInput.hidden = true;
      this.breadcrumbs.hidden = false;
      this.pathInput.value = this.currentPath;
    }

    renderBreadcrumbs() {
      this.breadcrumbs.replaceChildren();
      const parts = splitPath(this.currentPath);
      parts.forEach((part, index) => {
        if (index > 0) {
          const sep = document.createElement("span");
          sep.className = "crumb-sep";
          sep.textContent = "›";
          this.breadcrumbs.append(sep);
        }
        const button = document.createElement("button");
        button.type = "button";
        button.className = "crumb";
        button.textContent = part.label;
        button.title = part.path;
        button.addEventListener("click", event => {
          event.stopPropagation();
          setActivePane(this.id);
          this.navigate(part.path);
        });
        this.breadcrumbs.append(button);
      });
    }

    render() {
      this.body.replaceChildren();
      this.empty.hidden = this.entries.length !== 0;

      for (const entry of this.entries) {
        const row = document.createElement("tr");
        row.className = "entry";
        if (entry.path === this.selectedPath) row.classList.add("selected");
        row.tabIndex = 0;

        const nameCell = document.createElement("td");
        const nameWrap = document.createElement("div");
        nameWrap.className = "name-cell";
        const icon = document.createElement("span");
        icon.className = "icon " + entry.kind + (entry.brokenLink ? " broken" : "");
        icon.innerHTML = iconSvg(entry);
        const name = document.createElement("span");
        name.className = "name";
        name.textContent = entry.name;
        nameWrap.append(icon, name);
        nameCell.append(nameWrap);

        const typeCell = document.createElement("td");
        typeCell.textContent = kindLabel(entry);
        const sizeCell = document.createElement("td");
        sizeCell.textContent = formatSize(entry.size);
        const modifiedCell = document.createElement("td");
        modifiedCell.textContent = formatModified(entry.modifiedMs);
        row.append(nameCell, typeCell, sizeCell, modifiedCell);

        row.addEventListener("click", () => {
          setActivePane(this.id);
          this.selectedPath = entry.path;
          this.render();
        });

        const canNavigate = entry.kind === "directory"
          || (entry.kind === "symlink" && entry.linkTargetKind === "directory" && !entry.brokenLink);

        row.addEventListener("dblclick", () => {
          if (canNavigate) this.navigate(entry.path);
        });
        row.addEventListener("keydown", event => {
          if (event.key === "Enter" && canNavigate) {
            event.preventDefault();
            this.navigate(entry.path);
          }
        });

        this.body.append(row);
      }

      this.status.classList.remove("error");
      this.status.textContent = `${this.entries.length} item${this.entries.length === 1 ? "" : "s"}`;
      this.updateButtons();
    }

    async load(path = null, historyMode = "push", fallbackToInitial = false) {
      if (this.busy) return false;
      const previousPath = this.currentPath;
      this.setBusy(true);
      this.status.classList.remove("error");
      this.status.textContent = "Loading…";

      try {
        const result = path === null
          ? await request("fs.initial")
          : await request("fs.list", { path });

        if (historyMode === "push" && previousPath && previousPath !== result.path) {
          this.back.push(previousPath);
          this.forward = [];
        }

        this.currentPath = result.path;
        this.parentPath = result.parent || null;
        this.entries = Array.isArray(result.entries) ? result.entries : [];
        this.selectedPath = null;
        this.pathInput.value = this.currentPath;
        this.renderBreadcrumbs();
        this.render();
        scheduleSave();
        return true;
      } catch (error) {
        if (fallbackToInitial && path !== null) {
          this.setBusy(false);
          return this.load(null, "initial", false);
        }
        this.status.classList.add("error");
        this.status.textContent = String(error);
        this.pathInput.value = this.currentPath || path || "";
        if (!this.pathInput.hidden) this.pathInput.focus();
        return false;
      } finally {
        this.setBusy(false);
        this.updateButtons();
      }
    }

    navigate(path) {
      if (!path || path === this.currentPath) return;
      this.load(path, "push");
    }

    async goBack() {
      if (this.busy || this.back.length === 0) return;
      const target = this.back.pop();
      if (this.currentPath) this.forward.push(this.currentPath);
      const ok = await this.load(target, "history");
      if (!ok) {
        this.forward.pop();
        this.back.push(target);
      }
      this.updateButtons();
    }

    async goForward() {
      if (this.busy || this.forward.length === 0) return;
      const target = this.forward.pop();
      if (this.currentPath) this.back.push(this.currentPath);
      const ok = await this.load(target, "history");
      if (!ok) {
        this.back.pop();
        this.forward.push(target);
      }
      this.updateButtons();
    }
  }

  function setActivePane(id) {
    if (id === "right" && !dualPane) id = "left";
    activePaneId = id;
    for (const pane of Object.values(panes)) {
      pane.element.classList.toggle("active", pane.id === activePaneId);
    }
    scheduleSave();
  }

  function activePane() {
    return panes[activePaneId] || panes.left;
  }

  function applyLayout() {
    panesHost.classList.toggle("dual", dualPane);
    panes.right.setHidden(!dualPane);
    dualToggle.setAttribute("aria-pressed", String(dualPane));
    dualToggle.textContent = dualPane ? "Single Pane" : "Dual Pane";
    if (!dualPane && activePaneId === "right") setActivePane("left");
  }

  function uiState() {
    return {
      dualPane,
      leftPath: panes.left.currentPath || null,
      rightPath: panes.right.currentPath || null,
      activePane: activePaneId
    };
  }

  function scheduleSave() {
    if (saveTimer !== null) clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      saveTimer = null;
      try {
        await request("ui.state.set", uiState());
      } catch (error) {
        console.warn("File Manager could not persist UI state:", error);
      }
    }, 150);
  }

  dualToggle.addEventListener("click", async () => {
    dualPane = !dualPane;
    if (dualPane && !panes.right.currentPath) {
      await panes.right.load(panes.left.currentPath || null, "initial", true);
    }
    applyLayout();
    scheduleSave();
  });

  window.addEventListener("mousedown", event => {
    if (event.button === 3) {
      event.preventDefault();
      activePane().goBack();
      return;
    }
    if (event.button === 4) {
      event.preventDefault();
      activePane().goForward();
    }
  }, { capture: true });

  window.addEventListener("auxclick", event => {
    if (event.button === 3 || event.button === 4) event.preventDefault();
  }, { capture: true });

  window.addEventListener("keydown", event => {
    const pane = activePane();
    if (event.ctrlKey && event.key.toLowerCase() === "l") {
      event.preventDefault();
      pane.beginPathEdit(true);
      return;
    }
    if (event.altKey && event.key === "ArrowLeft") {
      event.preventDefault();
      pane.goBack();
      return;
    }
    if (event.altKey && event.key === "ArrowRight") {
      event.preventDefault();
      pane.goForward();
      return;
    }
    if (event.altKey && event.key === "ArrowUp") {
      event.preventDefault();
      if (pane.parentPath) pane.navigate(pane.parentPath);
      return;
    }
    if (event.key === "F5") {
      event.preventDefault();
      if (pane.currentPath) pane.load(pane.currentPath, "refresh");
    }
  });

  async function initialize() {
    panes.left = new BrowserPane("left");
    panes.right = new BrowserPane("right");

    let stored = null;
    try {
      stored = await request("ui.state.get");
    } catch (error) {
      console.warn("File Manager could not restore UI state:", error);
    }

    dualPane = Boolean(stored && stored.dualPane);
    activePaneId = stored && stored.activePane === "right" ? "right" : "left";
    applyLayout();
    setActivePane(activePaneId);

    const leftPath = stored && stored.leftPath ? stored.leftPath : null;
    await panes.left.load(leftPath, "initial", true);

    const rightPath = stored && stored.rightPath ? stored.rightPath : panes.left.currentPath;
    await panes.right.load(rightPath || null, "initial", true);

    applyLayout();
    setActivePane(activePaneId);
    scheduleSave();
  }

  initialize();
})();
</script>
</body>
</html>
